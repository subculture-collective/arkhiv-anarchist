name: Mirror CI
run-name: Mirror CI ${{ github.sha }}
'on':
  push:
    branches-ignore: [main]
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: make verify
    if: github.repository == 'subculture-collective/arkhiv-anarchist'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version-file: backend/go.mod
        cache: true
        cache-dependency-path: backend/go.sum
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Install pinned pnpm
      shell: bash
      run: |
        set -euo pipefail
        npm install --global --prefix "$RUNNER_TEMP/arkhiv-pnpm" pnpm@10.33.0
        echo "$RUNNER_TEMP/arkhiv-pnpm/bin" >> "$GITHUB_PATH"
    - name: Locate the pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - name: Restore the pnpm store
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-v1-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
    - name: Install backup test dependency
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v rsync >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rsync
        fi
    - name: Verify
      run: make verify
  browser:
    name: Browser smoke and deployable image
    if: github.repository == 'subculture-collective/arkhiv-anarchist'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Isolated browser and PostgreSQL 17 smoke
      run: make test-browser
    - name: Build the deployable public reader image and test its nginx configuration
      shell: bash
      env:
        REVISION: ${{ github.sha }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$REVISION"
        image="mirror-ci/anarchist-archive/public-web:$REVISION"
        docker build -f web/Dockerfile --label "org.opencontainers.image.revision=$REVISION" -t "$image" web
        docker run --rm --network none --add-host api:127.0.0.1 --entrypoint nginx "$image" -t
  mirror-gate:
    name: Mirror CI gate
    if: always() && github.repository == 'subculture-collective/arkhiv-anarchist'
    needs:
    - verify
    - browser
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Require every verification job
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PY'
        import json, os
        results = json.loads(os.environ["RESULTS"])
        expected = {'verify', 'browser'}
        assert set(results) == expected, results
        for name, result in results.items():
            assert result["result"] == "success", name + " did not pass"
        PY
