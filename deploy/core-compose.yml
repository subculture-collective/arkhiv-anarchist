# Anarchist core: its own database and the pinned archive core in print
# compatibility mode. anarchist-archive.subcult.tv's web container
# (arkhiv-pilot-public-web-1) proxies /api to anarchist-core:8080 on the
# arkhiv-pilot_public-reader network. Source of truth: deploy/core-compose.yml
# in subculture-collective/arkhiv-anarchist. Configure through .env beside it.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: arkhiv
      POSTGRES_DB: arkhiv
      POSTGRES_PASSWORD_FILE: /run/secrets/database-password
    volumes:
      - ./runtime/database-password:/run/secrets/database-password:ro
      - ./runtime/database:/var/lib/postgresql/data
    networks:
      core:
        aliases: [anarchist-core-db]
    # pg_dump expands retained legacy exports while readers remain connected.
    mem_limit: 1536m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, pg_isready -U arkhiv -d arkhiv]
      interval: 5s
      timeout: 5s
      retries: 20
  core:
    image: ${ARCHIVE_ENGINE_IMAGE:?Select the reviewed immutable core pin}
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      # Read-only serving role (arkhiv_reader).
      DATABASE_URL_FILE: /run/secrets/database-url
      ARKHIV_COMPATIBILITY: print
      ARKHIV_PUBLIC: "1"
      # Compatibility serving takes exactly one collection. a-info-zines is
      # imported but private, as it was in the legacy app.
      VHNESS_COLLECTION: anarchist-zines
      VHNESS_MEDIA: /archive
      VHNESS_DERIVATIVES: /archive
    volumes:
      - ./runtime/public-database-url:/run/secrets/database-url:ro
      - ${ARCHIVE_ROOT:?Set the Anarchist archive root}:/archive:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=64m]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    networks:
      core: {}
      public-reader:
        aliases: [anarchist-core]
  # Operator jobs (migrate, migration apply, reviews) with the owner role; never serves.
  operator:
    profiles: [operator]
    image: ${ARCHIVE_ENGINE_IMAGE:?Select the reviewed immutable core pin}
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL_FILE: /run/secrets/database-url
      VHNESS_COLLECTIONS: anarchist-zines,a-info-zines
      VHNESS_MEDIA: /archive
      VHNESS_DERIVATIVES: /archive
      # migrate grants this read-only serving role SELECT on new tables (core 0.4.11+).
      ARKHIV_READER_ROLE: arkhiv_reader
    volumes:
      - ./runtime/database-url:/run/secrets/database-url:ro
      - ${ARCHIVE_ROOT:?Set the Anarchist archive root}:/archive:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=256m]
    networks: [core]
networks:
  core:
    internal: true
    ipam:
      config:
        - subnet: ${CORE_SUBNET:?Select an unused reviewed subnet}
  public-reader:
    name: arkhiv-pilot_public-reader
    external: true
